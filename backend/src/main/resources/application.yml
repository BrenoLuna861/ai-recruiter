spring:
  application:
    name: ai-recruiter

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_recruiter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${MYSQL_USER:airecruiter}
    password: ${MYSQL_PASSWORD:devpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 50

  data:
    mongodb:
      # serverSelectionTimeoutMS=3000: fail fast (3s) if MongoDB is unreachable
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai_recruiter_logs?serverSelectionTimeoutMS=3000}
      auto-index-creation: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-256-bits-minimum}
  expiration: ${JWT_EXPIRATION:2592000000}
  refresh-expiration: 604800000

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  base-url: https://api.anthropic.com
  model: claude-sonnet-4-6
  max-tokens: 4096

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:AI Recruiter <onboarding@resend.dev>}

app:
  frontend-url: ${APP_FRONTEND_URL:https://ai-recruiter.com.br}

jobs:
  # Cache das buscas externas. O plano gratuito da Adzuna da 1.000 chamadas por MES,
  # entao sem cache alguem recarregando a pagina queima a cota rapido.
  cache-minutes: ${JOBS_CACHE_MINUTES:30}
  adzuna:
    # Crie em https://developer.adzuna.com. Em branco, o sistema usa o Remotive.
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: ${ADZUNA_COUNTRY:br}

email-verification:
  # Validade do código de confirmação de cadastro
  ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:30}
  # Tentativas erradas antes de o código ser descartado. É isto que impede
  # força bruta num número de apenas seis dígitos.
  max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
  max-per-window: ${EMAIL_VERIFICATION_MAX_PER_WINDOW:3}

password-reset:
  # Validade do link enviado por e-mail
  ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
  # Quantos pedidos o MESMO e-mail pode fazer dentro da janela do ttl
  max-per-email-window: ${PASSWORD_RESET_MAX_PER_EMAIL:3}
  rate-limit:
    # Freio por IP. Em memoria — valido enquanto railway.json fixar numReplicas: 1
    max-per-window: ${PASSWORD_RESET_RATE_MAX:5}
    window-minutes: ${PASSWORD_RESET_RATE_WINDOW:15}

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Administrator}

logging:
  level:
    com.airecruiter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
