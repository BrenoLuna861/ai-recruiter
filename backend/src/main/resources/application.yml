spring:
  application:
    name: ai-recruiter

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_recruiter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${MYSQL_USER:airecruiter}
    password: ${MYSQL_PASSWORD:devpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 50

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai_recruiter_logs}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-256-bits-minimum}
  expiration: 86400000
  refresh-expiration: 604800000

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  base-url: https://api.anthropic.com
  model: claude-sonnet-4-5
  max-tokens: 4096

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Administrator}

logging:
  level:
    com.airecruiter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
