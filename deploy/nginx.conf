# ============================================================
# AI Recruiter — Nginx Production Config
# Inclui: rate limiting, security headers, HTTPS, gzip
# ============================================================

# ---- Rate Limiting Zones ----
limit_req_zone $binary_remote_addr zone=api_global:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m      rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m    rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---- Gzip ----
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml
  font/woff2;

# ---- Redirect HTTP → HTTPS ----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS Main Server ----
server {
    listen 443 ssl http2;
    server_name seudominio.com www.seudominio.com;

    # --- SSL ---
    ssl_certificate     /etc/ssl/ai-recruiter/fullchain.pem;
    ssl_certificate_key /etc/ssl/ai-recruiter/privkey.pem;

    # Apenas TLS 1.2 e 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self' https://api.anthropic.com;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # Ocultar versão do Nginx
    server_tokens off;

    # Limite de upload (currículos PDF)
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 65;
    send_timeout 30s;

    # Limitar conexões simultâneas por IP
    limit_conn conn_limit 20;

    root /usr/share/nginx/html;
    index index.html;

    # --- Frontend (Vue SPA) ---
    location / {
        try_files $uri $uri/ /index.html;

        # Cache assets com hash no nome
        location ~* \.(js|css|woff2|woff|ttf|ico|svg|png|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Sem cache no index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }
    }

    # --- API Proxy → Spring Boot ---
    location /api/ {
        # Rate limiting geral para API
        limit_req zone=api_global burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
        proxy_buffer_size     4k;
        proxy_buffers         8 8k;

        # Remover headers internos sensíveis
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Rate limit agressivo em auth (brute force protection)
    location /api/auth/login {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit em upload de currículo
    location /api/resumes/analyze {
        limit_req zone=api_upload burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 10m;

        proxy_pass http://backend:8080/api/resumes/analyze;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # IA pode demorar
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\.(env|git|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    location ~ \.(sql|bak|log|conf|yaml|yml|xml|json)$ {
        deny all;
        return 404;
    }

    # Health check público (sem rate limit)
    location /api/auth/health {
        proxy_pass http://backend:8080/api/auth/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Página de erro customizada para 429
    error_page 429 /429.html;
    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }
}
